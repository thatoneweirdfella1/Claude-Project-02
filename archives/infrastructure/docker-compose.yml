version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adhd-translator-backend
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - DATABASE_PATH=/data/app.db
      - LOG_FILE=/data/logs/app.log
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - ENABLE_EXTENDED_THINKING=true
      - ENABLE_MULTI_AI=true
    volumes:
      - ./data:/data
      - ./backend:/app/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass API URL as a build arg so CRA can bake it into the bundle
        - REACT_APP_API_URL=http://localhost:8000
    container_name: adhd-translator-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: alpine:latest
    container_name: adhd-translator-db
    volumes:
      - ./data:/data
    entrypoint: /bin/sh
    command: -c "mkdir -p /data/logs && touch /data/app.db && sleep infinity"

volumes:
  data:
    driver: local
