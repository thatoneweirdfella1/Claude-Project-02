name: Codex Source Snapshot

on:
  push:
    branches:
      - frozen-implementation-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    name: Package isolated branch source
    runs-on: ubuntu-latest
    steps:
      - name: Check out frozen implementation branch
        uses: actions/checkout@v4

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: frozen-implementation-source
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
