<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Divergence.AI Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --sb-width: 220px;
  --bg-main: #0d0f14;
  --bg-card: #161921;
  --bg-card2: #1d2030;
  --border: #272b3a;
  --text: #e8eaed;
  --dim: #8a9099;
  --accent: #4a9eff;
  --purple: #9b5cff;
  --green: #2dd36f;
  --red: #ff5c5c;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg-main);
  background-image: url('marble-bg.png');
  background-size: cover;
  background-attachment: fixed;
  color: var(--text);
}

.app {
  display: flex;
  height: 100vh;
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: var(--sb-width);
  min-height: 100vh;
  background: linear-gradient(135deg, rgba(13,15,20,0.95), rgba(20,25,35,0.95));
  border-right: 1px solid var(--border);
  padding: 20px 10px;
  overflow-y: auto;
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  font-family: 'Orbitron';
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 1px;
}

.brand-icon {
  font-size: 24px;
  filter: drop-shadow(0 0 8px rgba(155,92,255,0.3));
}

.brand-text {
  color: var(--text);
}

.brand-dot {
  color: var(--purple);
}

.nav-section {
  margin-bottom: 12px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 10px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--dim);
  cursor: pointer;
  font-family: 'Inter';
  font-size: 13px;
  transition: all 0.15s ease;
  text-align: left;
}

.nav-item:hover {
  background: rgba(255,255,255,0.08);
  color: var(--text);
}

.nav-item.active {
  background: rgba(74,158,255,0.2);
  color: var(--accent);
  font-weight: 600;
}

.nav-icon {
  font-size: 18px;
  flex-shrink: 0;
}

.nav-divider {
  height: 1px;
  background: var(--border);
  margin: 8px 0;
}

/* ===== MAIN CONTENT ===== */
.main-content {
  margin-left: var(--sb-width);
  width: calc(100% - var(--sb-width));
  height: 100vh;
  overflow-y: auto;
  padding: 40px;
  background: linear-gradient(180deg, rgba(13,15,20,0.1), rgba(13,15,20,0.3));
}

/* ===== PAGE HEADER ===== */
.page-header {
  text-align: center;
  margin-bottom: 40px;
}

.page-title {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 12px;
}

.page-title-icon {
  font-size: 48px;
  filter: drop-shadow(0 0 12px rgba(155,92,255,0.4));
}

.page-title-text {
  font-family: 'Orbitron';
  font-size: 36px;
  font-weight: 900;
  letter-spacing: 1px;
}

.page-title-text .purple {
  color: var(--purple);
}

.page-sub {
  font-size: 14px;
  color: var(--dim);
  max-width: 600px;
  margin: 0 auto;
  line-height: 1.5;
}

/* ===== CARDS ===== */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 20px;
}

.card label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 10px;
  letter-spacing: 0.5px;
}

.card p {
  font-size: 12px;
  color: var(--dim);
  margin-top: 6px;
}

.card input[type="password"],
.card input[type="text"],
.card textarea,
.card select {
  width: 100%;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--text);
  font-family: 'Inter';
  font-size: 14px;
  margin-bottom: 10px;
}

.card input[type="password"]::placeholder,
.card input[type="text"]::placeholder,
.card textarea::placeholder {
  color: var(--dim);
}

.card input:focus,
.card textarea:focus,
.card select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 8px rgba(74,158,255,0.2);
}

.card textarea {
  resize: vertical;
  min-height: 100px;
}

/* ===== ROW LAYOUT ===== */
.row {
  display: flex;
  gap: 16px;
  margin-bottom: 12px;
}

.row > div {
  flex: 1;
}

/* ===== BUTTONS ===== */
.go {
  width: 100%;
  padding: 14px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 9px;
  cursor: pointer;
  font-family: 'Inter';
  font-size: 15px;
  font-weight: 600;
  transition: all 0.15s ease;
}

.go:hover {
  background: #3a8fe0;
  box-shadow: 0 0 16px rgba(74,158,255,0.4);
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar {
  width: 10px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 5px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--dim);
}

/* ===== THREAD & ANSWER CARDS ===== */
.hidden {
  display: none !important;
}

.bubble {
  padding: 12px;
  margin-bottom: 8px;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.5;
}

.bubble.me {
  background: rgba(74,158,255,0.15);
  margin-left: 20px;
}

.bubble.ai {
  background: rgba(155,92,255,0.12);
}

.answer {
  background: transparent;
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}

.raw {
  background: rgba(0,0,0,0.3);
  padding: 10px;
  border-radius: 6px;
  font-family: 'Courier New';
  font-size: 12px;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 200px;
  overflow-y: auto;
}

.stages {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 8px;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}

.pill.green {
  background: rgba(45,211,111,0.2);
  color: var(--green);
}

.pill.blue {
  background: rgba(74,158,255,0.2);
  color: var(--accent);
}

.pill.amber {
  background: rgba(245,166,35,0.2);
  color: var(--amber);
}

.pill.purple {
  background: rgba(155,92,255,0.2);
  color: var(--purple);
}

.err {
  padding: 10px;
  background: rgba(255,92,92,0.15);
  border: 1px solid var(--red);
  border-radius: 6px;
  color: var(--red);
  font-size: 12px;
  margin-top: 10px;
}

.meta {
  font-size: 12px;
  color: var(--dim);
  margin-top: 6px;
}

.spin {
  display: inline-block;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div class="app">

<!-- SIDEBAR -->
<nav class="sidebar">
  <div class="brand">
    <span class="brand-icon">⚡</span>
    <span class="brand-text">Divergence<span class="brand-dot">.AI</span></span>
  </div>

  <div class="nav-section">
    <button class="nav-item">
      <span class="nav-icon">⊞</span>
      <span>Dashboard</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">⊞</span>
      <span>Create New</span>
    </button>
  </div>

  <div class="nav-divider"></div>

  <div class="nav-section">
    <button class="nav-item">
      <span class="nav-icon">💬</span>
      <span>Messages</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">🗄</span>
      <span>Archive</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">🔗</span>
      <span>Resources</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">💼</span>
      <span>Projects</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">⟨/⟩</span>
      <span>Integrations</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">☑</span>
      <span>Tasks</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">🎨</span>
      <span>Customize</span>
    </button>
  </div>

  <div class="nav-divider"></div>

  <div class="nav-section">
    <button class="nav-item active">
      <span class="nav-icon">⚡</span>
      <span>Translate</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">⎇</span>
      <span>Route/Model</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">🔧</span>
      <span>Techniques</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">▶</span>
      <span>Answer/Execute</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">★</span>
      <span>Feedback</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">👥</span>
      <span>Debate</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">∞</span>
      <span>Consensus</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">⚛</span>
      <span>Synthesis</span>
    </button>
  </div>

  <div class="nav-divider"></div>

  <div class="nav-section">
    <button class="nav-item">
      <span class="nav-icon">?</span>
      <span>Help</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">👤</span>
      <span>Profile</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">⚙</span>
      <span>Settings</span>
    </button>
  </div>
</nav>

<!-- MAIN CONTENT -->
<main class="main-content">
  <div class="page-header">
    <div class="page-title">
      <div class="page-title-icon">🧠</div>
      <div class="page-title-text">Divergence<span class="purple">.AI</span></div>
    </div>
    <p class="page-sub">Type how you actually think. Get back an answer with no flattery, no flow-breaking, no overwhelm.</p>
  </div>

  <!-- API KEY CARD -->
  <div class="card">
    <label>Anthropic API Key <span style="text-transform:none;font-weight:400">(stored only in this browser — never leaves your device except to Anthropic)</span></label>
    <input type="password" id="apiKey" placeholder="sk-ant-...">
    <p>Get one free at <a href="https://console.anthropic.com" target="_blank" style="color: var(--accent);">console.anthropic.com</a>. Saved locally — paste once.</p>
  </div>

  <!-- INPUT CARD -->
  <div class="card">
    <label>What's on your mind? (ramble freely)</label>
    <textarea id="input" placeholder="okay so like i've been thinking... should i use react or vue for this thing, but also what about speed, and honestly i'm kinda overwhelmed by all the options ugh"></textarea>

    <div class="row">
      <div>
        <label>Model</label>
        <select id="model">
          <option value="claude-opus-4-8">Opus 4.8 — smartest</option>
          <option value="claude-sonnet-4-6">Sonnet 4.6 — balanced</option>
          <option value="claude-haiku-4-5-20251001">Haiku 4.5 — fast & cheap</option>
        </select>
      </div>
      <div>
        <label>Directness</label>
        <select id="directness">
          <option value="high">High — direct but human</option>
          <option value="max">Max — robotic, zero pleasantries</option>
          <option value="off">Off — leave AI as-is</option>
        </select>
      </div>
    </div>

    <button class="go" id="goBtn">Translate & Ask →</button>
    <div id="err" class="err hidden"></div>
  </div>

  <!-- THREAD CARD -->
  <div class="card hidden" id="threadCard">
    <label>Conversation</label>
    <div id="thread"></div>
  </div>

  <!-- ANSWER CARD -->
  <div class="card hidden" id="answerCard">
    <label>Latest Answer</label>
    <div id="answer" class="answer"></div>
    <div id="stages" class="stages"></div>
    <details>
      <summary>Show raw answer (before cleanup)</summary>
      <div id="raw" class="raw"></div>
    </details>
  </div>
</main>

</div>

<script>
// Minimal JS just to show the structure
document.getElementById('goBtn').onclick = function() {
  alert('Button works! This is just a visual mockup.\n\nDoes this layout match your screenshot?');
};
</script>

</body>
</html>
